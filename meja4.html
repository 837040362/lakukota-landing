<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misteri Meja No. 4 - LAKUKOTA</title>

    <!-- Import A-Frame dan AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* UI Overlay di atas kamera AR */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
        
        .ui-layer {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);
            padding: 30px 20px 20px 20px;
            box-sizing: border-box;
            z-index: 10; /* Pastikan UI berada di atas kanvas AR */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cerita-box {
            color: #cbd5e1;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        
        .cerita-box strong { color: #38bdf8; font-size: 1.1rem; letter-spacing: 1px; }

        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #38bdf8;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }
        
        input:focus { outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

        button {
            padding: 12px 20px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        /* Pesan Sukses */
        #pesanSukses {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- ENGINE AR.JS & A-FRAME -->
    <!-- VR button disembunyikan karena kita fokus ke AR -->
    <!-- Hapus atribut 'embedded' dan tambahkan parameter dimensi layar -->
    <a-scene arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960;" 
    vr-mode-ui="enabled: false">
        
        <!-- TARGET MARKER FISIK (Gunakan Hiro Marker untuk testing) -->
        <a-marker preset="hiro">
            
            <!-- PUZZLE ANAMORFIK 3D -->
            <!-- 
                 Pemain harus mencari sudut pandang spesifik agar huruf-huruf yang terpisah 
                 jauh di sumbu Z, Y, dan X ini terlihat menyatu berkat ilusi perspektif.
            -->

            <!-- Aura misteri di dasar marker -->
            <a-circle radius="1.5" position="0 0 0" rotation="-90 0 0" color="#0ea5e9" opacity="0.2"></a-circle>

            <!-- Huruf S: Paling depan, paling kecil, posisi paling kiri bawah -->
            <a-text value="S" position="-1 0.2 1" scale="1 1 1" color="#fbbf24" align="center" font="monoid"></a-text>
            
            <!-- Huruf U: Agak mundur ke belakang, dinaikkan sedikit, ukuran diperbesar -->
            <a-text value="U" position="-0.5 0.5 0" scale="1.5 1.5 1.5" color="#fbbf24" align="center" font="monoid"></a-text>
            
            <!-- Huruf K: Di tengah-tengah, ditarik jauh ke belakang dan ke atas -->
            <a-text value="K" position="0 1.2 -1.5" scale="2.5 2.5 2.5" color="#fbbf24" align="center" font="monoid"></a-text>
            
            <!-- Huruf M: Semakin jauh ke belakang, posisinya bergeser ke kanan atas -->
            <a-text value="M" position="0.5 2.0 -3" scale="4 4 4" color="#fbbf24" align="center" font="monoid"></a-text>
            
            <!-- Huruf A: Paling jauh di ujung belakang, ukuran raksasa, di pojok kanan atas -->
            <a-text value="A" position="1.2 3.0 -5" scale="6 6 6" color="#fbbf24" align="center" font="monoid"></a-text>

            <!-- Objek pengecoh (Floating debris) untuk menyamarkan bentuk asli dari atas -->
            <a-box position="0.8 0.5 0.5" scale="0.2 0.2 0.2" color="#0ea5e9" animation="property: rotation; to: 360 360 0; loop: true; dur: 3000"></a-box>
            <a-box position="-1 1.5 -2" scale="0.3 0.3 0.3" color="#38bdf8" animation="property: rotation; to: 0 360 360; loop: true; dur: 4000"></a-box>

        </a-marker>

        <!-- KAMERA AR -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- ANTARMUKA UI WEB LAKUKOTA -->
    <div class="ui-layer">
        <div class="cerita-box">
            <strong>Misteri Meja No. 4</strong><br>
            "Kebenaran hanya terlihat oleh mereka yang merendahkan hati."<br>
            <small><i>(Geser sudut pandang kameramu ke arah meja)</i></small>
        </div>
        <div class="input-group">
            <input type="text" id="inputSandi" placeholder="Masukkan Sandi AR..." autocomplete="off">
            <button onclick="cekSandi()">Buka</button>
        </div>
    </div>

    <div id="pesanSukses">✨ ARTEFAK TERBUKA ✨</div>

    <!-- LOGIKA VALIDASI JAWABAN (VANILLA JS) -->
    <script>
        // Audio sederhana dari Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function mainkanSuaraSukses() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
        }

        function cekSandi() {
            const input = document.getElementById('inputSandi').value.toUpperCase().trim();
            if (input === "SUKMA") {
                document.getElementById('pesanSukses').style.display = "block";
                mainkanSuaraSukses();
                document.getElementById('inputSandi').blur(); // Sembunyikan keyboard HP
                
                // Di sini Anda bisa men-trigger fungsi update ke database Supabase
                // setTimeout(() => { window.location.href = "halaman-berikutnya.html"; }, 3000);
            } else {
                // Efek getar merah pada input jika salah
                const inputEl = document.getElementById('inputSandi');
                inputEl.style.borderColor = "#f43f5e";
                inputEl.style.color = "#f43f5e";
                setTimeout(() => {
                    inputEl.style.borderColor = "#38bdf8";
                    inputEl.style.color = "#f8fafc";
                    inputEl.value = "";
                }, 800);
            }
        }
    </script>
</body>
</html>
