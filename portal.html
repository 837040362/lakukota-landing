<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihir Portal LAKUKOTA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        .ui-layer { position: absolute; top: 30px; text-align: center; z-index: 10; text-shadow: 0 2px 10px rgba(0,0,0,0.8); width: 100%; padding: 0 20px; box-sizing: border-box;}
        h1 { color: #fbbf24; margin: 0 0 10px 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        #status { font-size: 1.1rem; color: #cbd5e1; }
        
        .energi-wadah { width: 80%; max-width: 300px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; margin: 15px auto; overflow: hidden; box-shadow: 0 0 10px #f59e0b; }
        #energiBar { width: 0%; height: 100%; background: #fbbf24; transition: width 0.1s; box-shadow: 0 0 15px #f59e0b; }

        .kamera-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        
        .input_video { position: absolute; opacity: 0; width: 1px; height: 1px; z-index: -1; } 
        
        /* FIX ZOOM: Biarkan CSS yang menutupi layar, resolusi internal akan diatur oleh JS */
        .output_canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(1); }
        .mandala_canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; transform: scaleX(1); pointer-events: none; mix-blend-mode: screen; }

        .flash-sukses {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fbbf24; z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>

    <div class="kamera-container">
        <video class="input_video" autoplay playsinline muted></video>
        <!-- Ukuran kanvas kini akan menyesuaikan video asli secara otomatis dari JS -->
        <canvas class="output_canvas"></canvas>
        <canvas class="mandala_canvas"></canvas>
        <div id="flash" class="flash-sukses"></div>
    </div>
    
    <div class="ui-layer">
        <h1>Ritual Putaran Waktu</h1>
        <div id="status">Tadahkan tangan & putar pergelanganmu!</div>
        <div class="energi-wadah"><div id="energiBar"></div></div>
    </div>

    <script>
        const videoElement = document.querySelector('.input_video');
        const outputCanvas = document.querySelector('.output_canvas');
        const canvasCtx = outputCanvas.getContext('2d');
        const mandalaCanvas = document.querySelector('.mandala_canvas');
        const mandalaCtx = mandalaCanvas.getContext('2d');
        
        const teksStatus = document.getElementById('status');
        const energiBar = document.getElementById('energiBar');
        const flashScreen = document.getElementById('flash');

        // --- STATE & PARTIKEL ---
        let sudutSebelumnya = null;
        let totalPutaran = 0; 
        const TARGET_PUTARAN = 1080; 
        let ritualSelesai = false;
        let partikelSparks = []; // Array percikan api

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let oscPutaran = null, gainPutaran = null;

        function mulaiSuaraDengung() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (oscPutaran) return;
            oscPutaran = audioCtx.createOscillator();
            gainPutaran = audioCtx.createGain();
            oscPutaran.connect(gainPutaran); gainPutaran.connect(audioCtx.destination);
            oscPutaran.type = 'sawtooth'; oscPutaran.frequency.value = 100;
            gainPutaran.gain.value = 0.1;
            oscPutaran.start();
        }

        function updatePitchDengung(persentase) {
            if (oscPutaran && gainPutaran) {
                oscPutaran.frequency.value = 100 + (persentase * 4); 
                gainPutaran.gain.value = 0.1 + (persentase / 200); 
            }
        }

        function hentikanDengung() {
            if (oscPutaran) { oscPutaran.stop(); oscPutaran = null; gainPutaran = null; }
        }

        function mainkanSuaraLedakan() {
            hentikanDengung();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }

        // --- RENDERING MANDALA & PARTIKEL ---
        function gambarMandala(x, y, radius, sudutDerajat) {
            mandalaCtx.clearRect(0, 0, mandalaCanvas.width, mandalaCanvas.height);
            mandalaCtx.save();
            
            mandalaCtx.translate(x, y);
            mandalaCtx.rotate(sudutDerajat * Math.PI / 180);

            mandalaCtx.strokeStyle = '#fbbf24'; 
            mandalaCtx.lineWidth = 4;
            mandalaCtx.shadowBlur = 20;
            mandalaCtx.shadowColor = '#f59e0b';

            // Lingkaran Luar & Dalam
            mandalaCtx.beginPath(); mandalaCtx.arc(0, 0, radius, 0, Math.PI * 2); mandalaCtx.stroke();
            mandalaCtx.beginPath(); mandalaCtx.arc(0, 0, radius * 0.7, 0, Math.PI * 2); mandalaCtx.stroke();

            // Geometri Hexagram (Segi enam bersilang)
            mandalaCtx.beginPath();
            for (let i = 0; i < 6; i++) {
                let r = i % 2 === 0 ? radius : radius * 0.4;
                let a = (i * Math.PI) / 3;
                if (i === 0) mandalaCtx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
                else mandalaCtx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
            }
            mandalaCtx.closePath(); mandalaCtx.stroke();

            // Garis pendar energi
            for (let i = 0; i < 12; i++) {
                mandalaCtx.beginPath(); mandalaCtx.moveTo(0, 0);
                mandalaCtx.lineTo(Math.cos(i * Math.PI/6) * (radius * 0.9), Math.sin(i * Math.PI/6) * (radius * 0.9));
                mandalaCtx.lineWidth = 1; mandalaCtx.stroke();
            }
            mandalaCtx.restore();
            
            // --- RENDER PARTIKEL SPARKS ---
            for (let i = partikelSparks.length - 1; i >= 0; i--) {
                let p = partikelSparks[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.04; // Memudar perlahan
                
                if (p.life <= 0) {
                    partikelSparks.splice(i, 1);
                    continue;
                }
                
                mandalaCtx.beginPath();
                mandalaCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                mandalaCtx.fillStyle = `rgba(251, 191, 36, ${p.life})`;
                mandalaCtx.shadowBlur = 10;
                mandalaCtx.shadowColor = '#f59e0b';
                mandalaCtx.fill();
            }
        }

        // --- LOOP KAMERA ---
        function onResults(results) {
            // FIX ZOOM RESOLUSI DINAMIS: Sesuaikan resolusi internal kanvas dengan video asli
            if (outputCanvas.width !== results.image.width) {
                outputCanvas.width = results.image.width;
                outputCanvas.height = results.image.height;
                mandalaCanvas.width = results.image.width;
                mandalaCanvas.height = results.image.height;
            }

            canvasCtx.save(); 
            canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height); 
            canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
            
            if (ritualSelesai) {
                canvasCtx.restore();
                return; 
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                mulaiSuaraDengung();
                const tangan = results.multiHandLandmarks[0];
                drawConnectors(canvasCtx, tangan, HAND_CONNECTIONS, {color: 'rgba(251, 191, 36, 0.2)', lineWidth: 1});

                const tengahX = tangan[9].x * mandalaCanvas.width;
                const tengahY = tangan[9].y * mandalaCanvas.height;

                const dx = tangan[9].x - tangan[0].x;
                const dy = tangan[9].y - tangan[0].y;
                let sudutRad = Math.atan2(dy, dx);
                let sudutDeg = sudutRad * (180 / Math.PI); 

                let selisih = 0;
                if (sudutSebelumnya !== null) {
                    selisih = sudutDeg - sudutSebelumnya;
                    if (selisih > 180) selisih -= 360;
                    if (selisih < -180) selisih += 360;
                    totalPutaran += Math.abs(selisih); 
                }
                sudutSebelumnya = sudutDeg;

                let persentase = Math.min(100, (totalPutaran / TARGET_PUTARAN) * 100);
                energiBar.style.width = persentase + '%';
                updatePitchDengung(persentase);

                const jarakPergelangan = Math.hypot(dx, dy) * mandalaCanvas.width;
                const radiusPortal = Math.max(80, jarakPergelangan * 1.5); 
                
                // SISTEM GENERASI PARTIKEL (Sparks) jika tangan memutar aktif
                if (Math.abs(selisih) > 1.5) {
                    // Ciptakan 3-5 partikel setiap frame gerakan
                    let jumlahSparks = Math.random() * 3 + 2;
                    for(let i=0; i<jumlahSparks; i++) {
                        let sudutSpark = Math.random() * Math.PI * 2;
                        partikelSparks.push({
                            // Muncul di tepi batas cincin terluar
                            x: tengahX + Math.cos(sudutSpark) * radiusPortal,
                            y: tengahY + Math.sin(sudutSpark) * radiusPortal,
                            // Terlontar memancar ke luar (sentrifugal)
                            vx: Math.cos(sudutSpark) * (Math.random() * 8 + 3),
                            vy: Math.sin(sudutSpark) * (Math.random() * 8 + 3),
                            life: 1.0,
                            size: Math.random() * 4 + 1
                        });
                    }
                }

                gambarMandala(tengahX, tengahY, radiusPortal, -totalPutaran * 1.5);

                teksStatus.innerText = "Terus putar pusaran dimensinya!";
                teksStatus.style.color = "#fbbf24";

                if (totalPutaran >= TARGET_PUTARAN) {
                    ritualSelesai = true;
                    mandalaCtx.clearRect(0, 0, mandalaCanvas.width, mandalaCanvas.height);
                    teksStatus.innerHTML = "✨ KUNCI WAKTU TERBUKA ✨";
                    teksStatus.style.color = "#4ade80";
                    flashScreen.style.opacity = '1';
                    mainkanSuaraLedakan();
                    setTimeout(() => { flashScreen.style.opacity = '0'; }, 800);
                }

            } else {
                hentikanDengung();
                sudutSebelumnya = null;
                mandalaCtx.clearRect(0, 0, mandalaCanvas.width, mandalaCanvas.height);
                teksStatus.innerText = "Arahkan kamera ke relikui.\nTadahkan tangan & putar pergelanganmu!";
                teksStatus.style.color = "#cbd5e1";
                
                if (totalPutaran > 0 && !ritualSelesai) {
                    totalPutaran -= 2; 
                    energiBar.style.width = (totalPutaran / TARGET_PUTARAN * 100) + '%';
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);

        // Meminta resolusi standar yang stabil untuk mencegah zoom-in paksa
        const camera = new Camera(videoElement, { 
            onFrame: async () => { await hands.send({image: videoElement}); }, 
            width: 1280, height: 720,
            facingMode: 'environment' 
        });
        camera.start();
    </script>
</body>
</html>
