<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihir Portal Sling Ring LAKUKOTA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        .ui-layer { position: absolute; top: 30px; text-align: center; z-index: 10; text-shadow: 0 2px 10px rgba(0,0,0,0.8); width: 100%; padding: 0 20px; box-sizing: border-box;}
        h1 { color: #fbbf24; margin: 0 0 10px 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        #status { font-size: 1.1rem; color: #cbd5e1; }
        
        .energi-wadah { width: 80%; max-width: 300px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; margin: 15px auto; overflow: hidden; box-shadow: 0 0 10px #f59e0b; }
        #energiBar { width: 0%; height: 100%; background: #fbbf24; transition: width 0.1s; box-shadow: 0 0 15px #f59e0b; }

        .kamera-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        .input_video { position: absolute; opacity: 0; width: 1px; height: 1px; z-index: -1; } 
        
        .output_canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(1); }
        .mandala_canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; transform: scaleX(1); pointer-events: none; mix-blend-mode: screen; }

        .flash-sukses {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fbbf24; z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>

    <div class="kamera-container">
        <video class="input_video" autoplay playsinline muted></video>
        <canvas class="output_canvas"></canvas>
        <canvas class="mandala_canvas"></canvas>
        <div id="flash" class="flash-sukses"></div>
    </div>
    
    <div class="ui-layer">
        <h1>Buka Dimensi Sumbu</h1>
        <div id="status">Angkat dua jari, gambar lingkaran searah jarum jam!</div>
        <div class="energi-wadah"><div id="energiBar"></div></div>
    </div>

    <script>
        const videoElement = document.querySelector('.input_video');
        const outputCanvas = document.querySelector('.output_canvas');
        const canvasCtx = outputCanvas.getContext('2d');
        const mandalaCanvas = document.querySelector('.mandala_canvas');
        const mandalaCtx = mandalaCanvas.getContext('2d');
        
        const teksStatus = document.getElementById('status');
        const energiBar = document.getElementById('energiBar');
        const flashScreen = document.getElementById('flash');

        // --- STATE PORTAL ---
        let sudutSebelumnya = null;
        let totalPutaran = 0; 
        const TARGET_PUTARAN = 1080; // 3 Lingkaran penuh (3 x 360)
        let ritualSelesai = false;
        let partikelSparks = [];

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let oscPutaran = null, gainPutaran = null;

        function mulaiSuaraDengung() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (oscPutaran) return;
            oscPutaran = audioCtx.createOscillator();
            gainPutaran = audioCtx.createGain();
            oscPutaran.connect(gainPutaran); gainPutaran.connect(audioCtx.destination);
            oscPutaran.type = 'sawtooth'; oscPutaran.frequency.value = 80;
            gainPutaran.gain.value = 0.1;
            oscPutaran.start();
        }

        function updatePitchDengung(persentase) {
            if (oscPutaran && gainPutaran) {
                oscPutaran.frequency.value = 80 + (persentase * 5); 
                gainPutaran.gain.value = 0.1 + (persentase / 150); 
            }
        }

        function hentikanDengung() {
            if (oscPutaran) { oscPutaran.stop(); oscPutaran = null; gainPutaran = null; }
        }

        function mainkanSuaraLedakan() {
            hentikanDengung();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 2.0);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);
            osc.start(); osc.stop(audioCtx.currentTime + 2.0);
        }

        // --- RENDERING MANDALA & PARTIKEL ---
        function gambarMandala(x, y, radius, sudutDerajat) {
            mandalaCtx.clearRect(0, 0, mandalaCanvas.width, mandalaCanvas.height);
            
            // Render Portal Geometris
            if (radius > 5) {
                mandalaCtx.save();
                mandalaCtx.translate(x, y);
                mandalaCtx.rotate(sudutDerajat * Math.PI / 180);

                mandalaCtx.strokeStyle = '#fbbf24'; 
                mandalaCtx.lineWidth = 4 + (radius/50);
                mandalaCtx.shadowBlur = 25;
                mandalaCtx.shadowColor = '#f59e0b';

                mandalaCtx.beginPath(); mandalaCtx.arc(0, 0, radius, 0, Math.PI * 2); mandalaCtx.stroke();
                mandalaCtx.beginPath(); mandalaCtx.arc(0, 0, radius * 0.8, 0, Math.PI * 2); mandalaCtx.stroke();

                mandalaCtx.beginPath();
                for (let i = 0; i < 8; i++) {
                    let r = i % 2 === 0 ? radius : radius * 0.5;
                    let a = (i * Math.PI) / 4;
                    if (i === 0) mandalaCtx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
                    else mandalaCtx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
                }
                mandalaCtx.closePath(); mandalaCtx.stroke();
                mandalaCtx.restore();
            }
            
            // Render Partikel Percikan Api (Sparks)
            for (let i = partikelSparks.length - 1; i >= 0; i--) {
                let p = partikelSparks[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.2; // Efek gravitasi jatuh ke bawah
                p.life -= 0.03; 
                
                if (p.life <= 0) {
                    partikelSparks.splice(i, 1);
                    continue;
                }
                
                mandalaCtx.beginPath();
                mandalaCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                mandalaCtx.fillStyle = `rgba(251, 191, 36, ${p.life})`;
                mandalaCtx.shadowBlur = 15;
                mandalaCtx.shadowColor = '#f59e0b';
                mandalaCtx.fill();
            }
        }

        // --- LOOP KAMERA ---
        function onResults(results) {
            if (outputCanvas.width !== results.image.width) {
                outputCanvas.width = results.image.width; outputCanvas.height = results.image.height;
                mandalaCanvas.width = results.image.width; mandalaCanvas.height = results.image.height;
            }

            canvasCtx.save(); 
            canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height); 
            canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
            
            if (ritualSelesai) {
                canvasCtx.restore();
                return; 
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const tangan = results.multiHandLandmarks[0];
                
                const telunjukLurus = tangan[8].y < tangan[6].y;
                const tengahLurus = tangan[12].y < tangan[10].y;

                // Pusat portal ditetapkan di tengah layar
                const pusatPortalX = mandalaCanvas.width / 2;
                const pusatPortalY = mandalaCanvas.height / 2;

                if (telunjukLurus && tengahLurus) {
                    mulaiSuaraDengung();
                    
                    // Titik Pijar = Rata-rata koordinat telunjuk dan jari tengah
                    const pijarX = ((tangan[8].x + tangan[12].x) / 2) * mandalaCanvas.width;
                    const pijarY = ((tangan[8].y + tangan[12].y) / 2) * mandalaCanvas.height;

                    // Menggambar indikator visual di ujung jari
                    canvasCtx.beginPath();
                    canvasCtx.arc(pijarX, pijarY, 15, 0, Math.PI*2);
                    canvasCtx.fillStyle = 'rgba(251, 191, 36, 0.5)';
                    canvasCtx.fill();

                    // Hitung sudut jari mengelilingi pusat layar
                    const dx = pijarX - pusatPortalX;
                    const dy = pijarY - pusatPortalY;
                    let sudutRad = Math.atan2(dy, dx);
                    let sudutDeg = sudutRad * (180 / Math.PI); 

                    let selisih = 0;
                    if (sudutSebelumnya !== null) {
                        selisih = sudutDeg - sudutSebelumnya;
                        if (selisih > 180) selisih -= 360;
                        if (selisih < -180) selisih += 360;
                        
                        // HANYA menambah energi jika gerakan searah jarum jam (sudut positif)
                        if (selisih > 0) {
                            totalPutaran += selisih; 
                        }
                    }
                    sudutSebelumnya = sudutDeg;

                    let persentase = Math.min(100, (totalPutaran / TARGET_PUTARAN) * 100);
                    energiBar.style.width = persentase + '%';
                    updatePitchDengung(persentase);

                    // Radius maksimal portal adalah 40% dari lebar layar
                    const maxRadius = Math.min(mandalaCanvas.width, mandalaCanvas.height) * 0.4;
                    const radiusPortal = (totalPutaran / TARGET_PUTARAN) * maxRadius;
                    
                    // GENERASI PARTIKEL langsung dari ujung jari (pijarX, pijarY)
                    if (selisih > 2) {
                        let jumlahSparks = Math.random() * 5 + 3;
                        for(let i=0; i<jumlahSparks; i++) {
                            partikelSparks.push({
                                x: pijarX + (Math.random() * 20 - 10),
                                y: pijarY + (Math.random() * 20 - 10),
                                vx: Math.random() * 8 - 4,
                                vy: Math.random() * 8 - 6, // Cenderung melontar ke atas sedikit sebelum jatuh
                                life: 1.0,
                                size: Math.random() * 4 + 2
                            });
                        }
                    }

                    gambarMandala(pusatPortalX, pusatPortalY, radiusPortal, totalPutaran);

                    teksStatus.innerText = "Terus putar lingkarannya!";
                    teksStatus.style.color = "#fbbf24";

                    if (totalPutaran >= TARGET_PUTARAN) {
                        ritualSelesai = true;
                        mandalaCtx.clearRect(0, 0, mandalaCanvas.width, mandalaCanvas.height);
                        teksStatus.innerHTML = "✨ PORTAL DIMENSI TERBUKA ✨";
                        teksStatus.style.color = "#4ade80";
                        flashScreen.style.opacity = '1';
                        mainkanSuaraLedakan();
                        setTimeout(() => { flashScreen.style.opacity = '0'; }, 800);
                    }

                } else {
                    // Jari tidak dalam posisi "Sling Ring" (dua jari)
                    hentikanDengung();
                    sudutSebelumnya = null;
                    teksStatus.innerText = "Angkat telunjuk & jari tengah,\nlalu gambar lingkaran di udara!";
                    teksStatus.style.color = "#cbd5e1";
                    
                    if (totalPutaran > 0 && !ritualSelesai) {
                        totalPutaran -= 1.5; // Energi bocor lebih lambat
                        energiBar.style.width = (totalPutaran / TARGET_PUTARAN * 100) + '%';
                        
                        const maxRadius = Math.min(mandalaCanvas.width, mandalaCanvas.height) * 0.4;
                        const radiusPortal = Math.max(0, (totalPutaran / TARGET_PUTARAN) * maxRadius);
                        gambarMandala(pusatPortalX, pusatPortalY, radiusPortal, totalPutaran);
                    } else {
                        mandalaCtx.clearRect(0, 0, mandalaCanvas.width, mandalaCanvas.height);
                    }
                }
            } else {
                hentikanDengung();
                sudutSebelumnya = null;
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, { 
            onFrame: async () => { await hands.send({image: videoElement}); }, 
            width: 1280, height: 720,
            facingMode: 'environment' 
        });
        camera.start();
    </script>
</body>
</html>
