<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LAKUKOTA — Pande</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #202020 0%,
                    #111 45%,
                    #080808 100%
                );

            color: #e8dcc3;

            font-family:
                Georgia,
                'Times New Roman',
                serif;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 70px 20px;
        }


        .page {
            width: 100%;
            max-width: 520px;
        }


        /* =========================================
           HEADER
           ========================================= */

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-top {
            font-size: 12px;
            letter-spacing: 5px;
            margin-bottom: 6px;
        }

        .brand-title {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #d4af37;
        }

        .brand-subtitle {
            margin-top: 5px;
            font-size: 15px;
            letter-spacing: 1px;
        }


        /* =========================================
           CARD
           ========================================= */

        .card {
            background: #f3ecd9;
            color: #3d3427;

            border-radius: 15px;

            padding: 22px;

            box-shadow:
                0 25px 60px rgba(0,0,0,.45);
        }


        .section-title {
            font-size: 14px;
            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 20px;

            color: #765b16;
        }


        .divider {
            height: 1px;
            background: #d5c8a9;

            margin-bottom: 20px;
        }


        /* =========================================
           CAMERA
           ========================================= */

        #qr-reader {
            width: 100%;

            display: none;

            overflow: hidden;

            border-radius: 10px;

            background: #111;

            margin-bottom: 14px;
        }


        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            display: block;
        }


        .camera-status {
            text-align: center;

            font-size: 13px;

            color: #806b45;

            margin: 10px 0 15px;
        }


        .btn {
            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 13px;

            font-family: inherit;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;
        }


        .btn-camera {
            background: #b78b1d;
            color: white;

            margin-bottom: 14px;
        }


        .btn-camera:hover {
            background: #9d7617;
        }


        .btn-camera:disabled {
            opacity: .55;
            cursor: not-allowed;
        }


        .btn-stop {
            background: #5b5142;
            color: white;

            margin-bottom: 16px;

            display: none;
        }


        /* =========================================
           MANUAL
           ========================================= */

        .manual {
            border-top: 1px solid #d5c8a9;

            padding-top: 18px;
        }


        .manual-label {
            font-size: 11px;

            letter-spacing: 2px;

            color: #8a7653;

            margin-bottom: 7px;
        }


        #qr-token {
            width: 100%;

            padding: 13px;

            border-radius: 8px;

            border: 1px solid #cdbf9e;

            background: #fffdf7;

            color: #3d3427;

            font-family: monospace;

            font-size: 13px;

            outline: none;

            margin-bottom: 10px;
        }


        #qr-token:focus {
            border-color: #b78b1d;
        }


        .btn-submit {
            background: #30465b;
            color: white;
        }


        .btn-submit:hover {
            background: #263b4d;
        }


        .btn-submit:disabled {
            opacity: .55;
            cursor: not-allowed;
        }


        /* =========================================
           RESULT
           ========================================= */

        #result {
            display: none;

            margin-top: 18px;

            padding: 15px;

            border-radius: 9px;

            background: #e5dcc3;

            font-size: 13px;

            line-height: 1.6;
        }


        #result.success {
            border-left: 4px solid #4f7d55;
        }


        #result.error {
            border-left: 4px solid #9b4a43;
        }


        .result-title {
            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 5px;
        }


        /* =========================================
           FOOTER
           ========================================= */

        .footer {
            text-align: center;

            margin-top: 25px;

            font-size: 10px;

            letter-spacing: 2px;

            color: #75684f;
        }

    </style>

</head>


<body>

<div class="page">


    <!-- =========================================
         BRAND
         ========================================= -->

    <div class="brand">

        <div class="brand-top">
            L A K U K O T A
        </div>

        <div class="brand-title">
            PANDE
        </div>

        <div class="brand-subtitle">
            MEJA PENUKARAN
        </div>

    </div>


    <!-- =========================================
         CARD
         ========================================= -->

    <div class="card">


        <div class="section-title">
            RAJAH PENUKARAN
        </div>


        <div class="divider"></div>


        <!-- CAMERA -->

        <button
            id="btn-start-camera"
            class="btn btn-camera"
            type="button"
        >
            📷 PINDAI RAJAH
        </button>


        <div
            id="camera-status"
            class="camera-status"
        >
            Kamera belum diaktifkan.
        </div>


        <div id="qr-reader"></div>


        <button
            id="btn-stop-camera"
            class="btn btn-stop"
            type="button"
        >
            TUTUP KAMERA
        </button>


        <!-- MANUAL -->

        <div class="manual">

            <div class="manual-label">
                QR TOKEN
            </div>


            <input
                id="qr-token"
                type="text"
                placeholder="Tempel token Rajah..."
                autocomplete="off"
                spellcheck="false"
            >


            <button
                id="btn-submit"
                class="btn btn-submit"
                type="button"
            >
                VALIDASI RAJAH
            </button>

        </div>


        <!-- RESULT -->

        <div id="result"></div>


    </div>


    <div class="footer">
        LAKUKOTA · PANDE · OPERASIONAL
    </div>


</div>


<!-- =========================================
     LIBRARY
     ========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="js/kurir.js"></script>


</body>

</html>
