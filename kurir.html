<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LAKUKOTA — Pande</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #252525 0%,
          #111 45%,
          #050505 100%
        );

      color: #eee;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding: 30px 16px;

    }

    .app {

      width: 100%;

      max-width: 520px;

    }

    /* =====================================================
       HEADER
    ===================================================== */

    .header {

      text-align: center;

      margin-bottom: 24px;

    }

    .brand {

      font-size: 0.75rem;

      letter-spacing: 0.35em;

      color: #aaa;

      margin-bottom: 8px;

    }

    h1 {

      margin: 0;

      font-size: 2rem;

      letter-spacing: 0.12em;

      color: #d4af37;

    }

    .subtitle {

      margin-top: 8px;

      font-size: 0.85rem;

      color: #999;

      letter-spacing: 0.08em;

    }

    /* =====================================================
       CARD
    ===================================================== */

    .card {

      background: #f4eddb;

      color: #2c3e50;

      border-radius: 14px;

      padding: 22px;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.45);

      margin-bottom: 18px;

    }

    .card-title {

      font-size: 0.75rem;

      letter-spacing: 0.18em;

      color: #8a6d1d;

      margin-bottom: 18px;

      font-weight: bold;

    }

    /* =====================================================
       SCANNER
    ===================================================== */

    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 12px;

      background: #111;

      display: none;

      margin-bottom: 16px;

    }

    .scanner-help {

      font-size: 0.75rem;

      color: #777;

      line-height: 1.5;

      margin-top: 12px;

      text-align: center;

    }

    /* =====================================================
       INPUT
    ===================================================== */

    label {

      display: block;

      font-size: 0.7rem;

      letter-spacing: 0.12em;

      color: #777;

      margin-bottom: 7px;

    }

    input {

      width: 100%;

      padding: 13px 14px;

      border-radius: 8px;

      border: 1px solid #cfc5ab;

      background: #fffdf7;

      color: #222;

      font-family: monospace;

      font-size: 0.8rem;

      outline: none;

    }

    input:focus {

      border-color: #b28a21;

      box-shadow:
        0 0 0 2px rgba(178,138,33,0.15);

    }

    /* =====================================================
       BUTTON
    ===================================================== */

    button {

      width: 100%;

      border: 0;

      border-radius: 9px;

      padding: 14px;

      margin-top: 10px;

      font-family: inherit;

      font-weight: bold;

      letter-spacing: 0.08em;

      cursor: pointer;

    }

    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }

    .btn-primary {

      background: #2c3e50;

      color: white;

    }

    .btn-primary:hover:not(:disabled) {

      background: #1e2b37;

    }

    .btn-gold {

      background: #b28a21;

      color: white;

    }

    .btn-secondary {

      background: transparent;

      color: #2c3e50;

      border: 1px solid #b9ad91;

    }

    /* =====================================================
       STATUS
    ===================================================== */

    .status {

      display: none;

      border-radius: 9px;

      padding: 13px;

      margin-top: 14px;

      font-size: 0.8rem;

      line-height: 1.5;

    }

    .status.info {

      display: block;

      background: #e8eef3;

      color: #34495e;

    }

    .status.success {

      display: block;

      background: #e5f5eb;

      color: #176b3a;

    }

    .status.error {

      display: block;

      background: #f8e4e4;

      color: #8b2525;

    }

    /* =====================================================
       ORDER
    ===================================================== */

    #order-card {

      display: none;

    }

    .order-row {

      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 10px 0;

      border-bottom: 1px solid #ddd3bd;

      font-size: 0.8rem;

    }

    .order-row:last-child {

      border-bottom: 0;

    }

    .order-label {

      color: #777;

    }

    .order-value {

      text-align: right;

      font-weight: bold;

      max-width: 60%;

    }

    .token {

      font-family: monospace;

      font-size: 0.68rem;

      word-break: break-all;

    }

    .badge {

      display: inline-block;

      padding: 4px 9px;

      border-radius: 20px;

      font-size: 0.65rem;

      letter-spacing: 0.05em;

    }

    .badge-manifested {

      background: #f6e8b8;

      color: #765600;

    }

    .badge-received {

      background: #dff1e5;

      color: #176b3a;

    }

    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {

      text-align: center;

      color: #666;

      font-size: 0.65rem;

      letter-spacing: 0.08em;

      margin-top: 25px;

    }

  </style>

</head>


<body>

<div class="app">

  <!-- ===================================================
       HEADER
  ==================================================== -->

  <div class="header">

    <div class="brand">
      LAKUKOTA
    </div>

    <h1>PANDE</h1>

    <div class="subtitle">
      MEJA PENUKARAN
    </div>

  </div>


  <!-- ===================================================
       SCAN / TOKEN
  ==================================================== -->

  <div class="card">

    <div class="card-title">
      RAJAH PENUKARAN
    </div>


    <div id="reader"></div>


    <button
      id="btn-scan"
      class="btn-gold"
    >
      📷 PINDAI RAJAH
    </button>


    <div
      class="scanner-help"
      id="scanner-help"
    >
      Atau masukkan token Rajah secara manual.
    </div>


    <div style="margin-top:18px;">

      <label for="qr-token">
        QR TOKEN
      </label>

      <input
        id="qr-token"
        type="text"
        placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        autocomplete="off"
      >

    </div>


    <button
      id="btn-validasi"
      class="btn-primary"
    >
      VALIDASI RAJAH
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- ===================================================
       ORDER
  ==================================================== -->

  <div
    id="order-card"
    class="card"
  >

    <div class="card-title">
      DATA MANIFESTASI
    </div>


    <div class="order-row">

      <span class="order-label">
        Selaku
      </span>

      <span
        id="order-user"
        class="order-value"
      >
        —
      </span>

    </div>


    <div class="order-row">

      <span class="order-label">
        Atmaka
      </span>

      <span
        id="order-atmaka"
        class="order-value"
      >
        —
      </span>

    </div>


    <div class="order-row">

      <span class="order-label">
        Paket
      </span>

      <span
        id="order-package"
        class="order-value"
      >
        Atmaka + Lanyard
      </span>

    </div>


    <div class="order-row">

      <span class="order-label">
        Status
      </span>

      <span
        id="order-status"
        class="order-value"
      >
        —
      </span>

    </div>


    <div class="order-row">

      <span class="order-label">
        Batch
      </span>

      <span
        id="order-window"
        class="order-value"
      >
        —
      </span>

    </div>


    <div class="order-row">

      <span class="order-label">
        Rajah
      </span>

      <span
        id="order-token"
        class="order-value token"
      >
        —
      </span>

    </div>


    <button
      id="btn-terima"
      class="btn-gold"
    >
      📦 TERIMA PAKET
    </button>


    <button
      id="btn-reset"
      class="btn-secondary"
    >
      [ SELESAI / PESANAN BERIKUTNYA ]
    </button>

  </div>


  <div class="footer">
    LAKUKOTA · PANDE · OPERASIONAL
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

      SUPABASE_URL,
      SUPABASE_KEY
    );
</script>

<script src="./kurir.js"></script>

</body>
</html>
