<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Penjumlahan Jari</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f3f4f6;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 640px;
            margin-bottom: 15px;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .ui-container {
            text-align: center;
            margin-bottom: 20px;
            height: 120px; /* Fix height agar layout tidak lompat */
        }
        #soal { font-size: 3rem; font-weight: 800; color: #4ade80; margin: 10px 0; }
        #status { font-size: 1.2rem; color: #9ca3af; height: 30px; }
        
        /* Styling untuk bar durasi menjawab */
        progress {
            width: 200px;
            height: 10px;
            border-radius: 5px;
            visibility: hidden; /* Sembunyikan saat tidak menjawab */
        }
        progress::-webkit-progress-bar { background-color: #374151; border-radius: 5px; }
        progress::-webkit-progress-value { background-color: #fbbf24; border-radius: 5px; transition: width 0.1s; }

        .kamera-container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #374151;
        }
       .input_video {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            z-index: -1;
        }
        .output_canvas {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Game Hitung Jari</div>
        <div id="skorDisplay">Skor: 0</div>
    </div>

    <div class="ui-container">
        <div id="soal">Memuat...</div>
        <div id="status">Menginisialisasi kamera...</div>
        <progress id="holdProgress" value="0" max="100"></progress>
    </div>

    <div class="kamera-container">
        <video class="input_video" autoplay playsinline muted></video></video>
        <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.querySelector('.output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const teksSoal = document.getElementById('soal');
        const teksStatus = document.getElementById('status');
        const teksSkor = document.getElementById('skorDisplay');
        const progressBar = document.getElementById('holdProgress');
        
        // --- STATE GAME ---
        let skor = 0;
        let targetJawaban = 0;
        
        // --- STATE VALIDASI WAKTU ---
        let waktuMulaiTahan = null;
        const durasiTahanValid = 1500; // 1.5 detik harus menahan jari
        let statusBenar = false; // Mencegah skor dobel saat transisi

        // Konstanta MediaPipe
        const tips = [8, 12, 16, 20];
        const pips = [6, 10, 14, 18];

        function buatSoalBaru() {
            // Acak jawaban dari 1 sampai 10 (sesuai jumlah jari tangan)
            targetJawaban = Math.floor(Math.random() * 10) + 1;
            
            // Pecah targetJawaban menjadi dua angka penjumlahan
            const angka1 = Math.floor(Math.random() * (targetJawaban + 1));
            const angka2 = targetJawaban - angka1;

            teksSoal.innerText = `${angka1} + ${angka2} = ?`;
            
            // Reset state validasi
            waktuMulaiTahan = null;
            statusBenar = false;
            progressBar.style.visibility = 'hidden';
            progressBar.value = 0;
        }

        function updateGameLogic(totalJariTerbaca) {
            if (statusBenar) return; // Tunggu soal baru muncul, jangan proses input

            if (totalJariTerbaca === targetJawaban) {
                // Pemain mengacungkan jari dengan jumlah yang benar
                if (!waktuMulaiTahan) {
                    waktuMulaiTahan = Date.now(); // Catat waktu mulai menahan
                    progressBar.style.visibility = 'visible';
                }

                const waktuBerjalan = Date.now() - waktuMulaiTahan;
                const persentase = (waktuBerjalan / durasiTahanValid) * 100;
                progressBar.value = persentase;

                teksStatus.innerText = `Tahan posisi ini...`;
                teksStatus.style.color = "#fbbf24"; // Kuning

                if (waktuBerjalan >= durasiTahanValid) {
                    // Berhasil menahan selama 1.5 detik
                    statusBenar = true;
                    skor += 10;
                    teksSkor.innerText = `Skor: ${skor}`;
                    
                    teksStatus.innerText = `✅ TEPAT!`;
                    teksStatus.style.color = "#4ade80"; // Hijau
                    progressBar.value = 100;

                    // Beri jeda sedikit sebelum soal baru muncul agar pemain bisa lihat suksesnya
                    setTimeout(() => {
                        buatSoalBaru();
                        teksStatus.innerText = `Tunjukkan jarimu!`;
                        teksStatus.style.color = "#9ca3af";
                    }, 1000);
                }
            } else {
                // Jari tidak sesuai target jawaban
                waktuMulaiTahan = null;
                progressBar.style.visibility = 'hidden';
                progressBar.value = 0;
                
                if (totalJariTerbaca > 0) {
                    teksStatus.innerText = `Jari terbaca: ${totalJariTerbaca}`;
                } else {
                    teksStatus.innerText = `Tunjukkan jarimu!`;
                }
                teksStatus.style.color = "#9ca3af";
            }
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let totalJari = 0;

            if (results.multiHandLandmarks) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const handedness = results.multiHandedness[i].label;
                    
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#4ade80', lineWidth: 1, radius: 3});

                    let jariTanganIni = 0;

                    // Logika Jempol (Cek X)
                    if (handedness === 'Right') {
                        if (landmarks[4].x < landmarks[3].x) jariTanganIni++;
                    } else {
                        if (landmarks[4].x > landmarks[3].x) jariTanganIni++;
                    }

                    // Logika 4 Jari (Cek Y)
                    for (let j = 0; j < 4; j++) {
                        if (landmarks[tips[j]].y < landmarks[pips[j]].y) {
                            jariTanganIni++;
                        }
                    }
                    totalJari += jariTanganIni;
                }
            }
            
            // Panggil logika game hanya jika ada tangan yang terdeteksi
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                updateGameLogic(totalJari);
            } else {
                // Reset bar jika tangan hilang dari kamera
                waktuMulaiTahan = null;
                progressBar.style.visibility = 'hidden';
                if (!statusBenar) {
                    teksStatus.innerText = "Tangan tidak terlihat";
                    teksStatus.style.color = "#ef4444"; // Merah
                }
            }

            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        
        // Mulai kamera, lalu generate soal pertama
        camera.start().then(() => {
            buatSoalBaru();
            teksStatus.innerText = "Tunjukkan jarimu!";
        });
    </script>
</body>
</html>
